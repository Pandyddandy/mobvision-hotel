<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobVision Hotel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        #viewer { width: 100%; height: 100%; }
        .room-light-switch {
            position: absolute;
            right: 20px;
            top: 20px;
            z-index: 1000;
            width: 92px;
            min-height: 80px;
            padding: 10px;
            border: 1px solid #9b9180;
            border-radius: 6px;
            background: linear-gradient(135deg, #e0d9ca, #a89f90);
            color: #292720;
            box-shadow: inset 1px 1px 2px #fff8, 0 3px 8px #0008;
            font: 12px/1.4 Arial, sans-serif;
            cursor: pointer;
            touch-action: manipulation;
        }
        .room-light-rocker {
            display: block;
            width: 24px;
            height: 30px;
            margin: 0 auto 6px;
            border: 1px solid #807665;
            border-radius: 3px;
            background: linear-gradient(#f4ead3, #b7aa90);
            box-shadow: inset 0 2px 3px #fff9, 0 2px 2px #0005;
        }
        .room-light-switch.is-on .room-light-rocker { box-shadow: 0 0 12px #ffd486, inset 0 2px 3px #fff9; }
        .room-light-switch.is-off { background: linear-gradient(135deg, #827e75, #55524b); color: #eee6d6; }
        .room-light-switch.is-off .room-light-rocker { background: linear-gradient(#696459, #a59a84); }
        .room-light-switch:active .room-light-rocker { transform: scale(0.94); }
        .room-light-switch:focus-visible { outline: 2px solid #ffe0a0; outline-offset: 4px; }
        /* Custom exterior hotspot. Pannellum positions the outer element. */
        .enter-hotel-hotspot {
            width: 0;
            height: 0;
            margin: 0;
            background: none;
            border: 0;
        }
        .enter-hotel-button {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            width: 190px;
            height: 52px;
            box-sizing: border-box;
            padding: 0 22px;
            border: 1px solid rgba(211, 177, 112, 0.85);
            border-radius: 999px;
            background: rgba(20, 19, 17, 0.78);
            color: #ead3a3;
            box-shadow: 0 0 16px rgba(211, 177, 112, 0.24);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font: 500 13px/1 Georgia, serif;
            letter-spacing: 1.8px;
            white-space: nowrap;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }
        .enter-hotel-arrow { font-size: 24px; line-height: 1; }
        @media (hover: hover) and (pointer: fine) {
            .enter-hotel-button:hover {
                transform: translate(-50%, calc(-50% - 3px));
                background: rgba(30, 27, 21, 0.9);
                box-shadow: 0 0 24px rgba(211, 177, 112, 0.45);
            }
        }
        .enter-hotel-button:active {
            transform: translate(-50%, calc(-50% + 1px)) scale(0.97);
            background: rgba(65, 51, 29, 0.95);
            box-shadow: 0 0 10px rgba(211, 177, 112, 0.5);
        }
        .enter-hotel-button:focus-visible {
            outline: 2px solid #ead3a3;
            outline-offset: 4px;
        }
        @media (max-width: 600px) {
            .enter-hotel-button {
                width: 180px;
                height: 54px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .enter-hotel-button { transition: none; }
        }
        /* Temporary camera debug readout; remove with its HTML and update block. */
        #camera-debug {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 1000;
            padding: 8px 10px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font: 13px/1.5 monospace;
            white-space: pre;
            pointer-events: none;
        }
        #elevator-menu {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 450ms ease;
            touch-action: none;
        }
        #elevator-menu.is-closing { opacity: 0; pointer-events: auto; }
        #elevator-menu:not([hidden]) { display: flex; }
        .menu-panel {
            position: relative;
            width: min(300px, calc(100vw - 72px));
            max-height: calc(100dvh - 80px);
            overflow-y: auto;
            padding: 30px 24px;
            border: 1px solid #857259;
            border-radius: 14px;
            background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(225, 203, 167, 0.035) 2px 3px), linear-gradient(115deg, #171715, #50483b 35%, #292722 55%, #393328 80%, #171715);
            box-shadow: inset 1px 1px 2px #b09a77, inset -2px -2px 4px #080807, 0 24px 70px #000;
            color: #dcc8a3;
            font-family: Arial, sans-serif;
        }
        .menu-panel h2 { margin: 0 0 24px; font: 14px Georgia, serif; letter-spacing: 4px; text-align: center; text-shadow: 0 1px #000; }
        .elevator-display { padding: 12px; margin-bottom: 22px; border: 1px solid #756347; background: #10110e; color: #e6bd72; text-align: center; font: 12px/1.5 monospace; letter-spacing: 2px; box-shadow: inset 0 2px 8px #000; }
        .elevator-destinations { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 16px; }
        .elevator-stop { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 11px; letter-spacing: 2px; text-shadow: 0 1px 1px #000; }
        .elevator-button {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid #8c7c62;
            background: linear-gradient(135deg, #857962, #3d3931 45%, #25241f 55%, #655b49);
            color: #e0cfad;
            font: 20px Georgia, serif;
            box-shadow: 0 3px 5px #111, inset 1px 1px 3px #b6a486, inset -2px -2px 4px #161510;
            cursor: pointer;
            touch-action: manipulation;
            transition: box-shadow 150ms, transform 150ms, color 150ms;
        }
        .elevator-button:active { transform: translateY(2px); }
        .elevator-button.is-selected { transform: translateY(2px); color: #ffdfa0; border-color: #e2b66e; background: radial-gradient(circle, #94713c, #51402a 65%, #28251e); box-shadow: 0 0 20px #dba65480, inset 0 0 18px #e7b15b99, inset 0 2px 4px #17130d; text-shadow: 0 0 8px #ffcb70; }
        .elevator-button:disabled { cursor: default; }
        .menu-panel button:focus-visible { outline: 2px solid #ffdfa0; outline-offset: 4px; }
        #close-elevator { position: absolute; right: 10px; top: 8px; width: 36px; height: 36px; border: 0; background: transparent; color: #dcc8a3; font-size: 23px; cursor: pointer; }
        @media (prefers-reduced-motion: reduce) { #elevator-menu, .elevator-button { transition: none; } }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div id="elevator-menu" role="dialog" aria-modal="true" aria-labelledby="elevator-title" hidden>
        <div class="menu-panel">
            <h2 id="elevator-title">MOBVISION HOTEL</h2>
            <div id="elevator-status" class="elevator-display" role="status" aria-live="polite">SELECT DESTINATION</div>
            <div class="elevator-destinations">
                <div class="elevator-stop"><button class="elevator-button" type="button" data-destination="hall" aria-label="Rooms" aria-pressed="false">1</button><span>ROOMS</span></div>
                <div class="elevator-stop"><button class="elevator-button" type="button" data-destination="cafe" aria-label="Café" aria-pressed="false">C</button><span>CAFÉ</span></div>
                <div class="elevator-stop"><button class="elevator-button" type="button" data-destination="pool" aria-label="Pool" aria-pressed="false">P</button><span>POOL</span></div>
                <div class="elevator-stop"><button class="elevator-button" type="button" data-destination="gym" aria-label="Gym" aria-pressed="false">G</button><span>GYM</span></div>
            </div>
            <button id="close-elevator" type="button" aria-label="Close elevator panel">×</button>
        </div>
    </div>
    <script>
        const elevatorMenu = document.getElementById('elevator-menu');
        let previousFocus;
        const elevatorButtons = [...elevatorMenu.querySelectorAll('.elevator-button')];
        const elevatorStatus = document.getElementById('elevator-status');
        let elevatorBusy = false;
        let elevatorRun = 0;
        // Optional local audio: playback failures never interrupt the panel flow.
        const elevatorSounds = {
            door: new Audio('assets/sounds/elevator/elevator-door-open.mp3'),
            button: new Audio('assets/sounds/elevator/elevator-button.mp3'),
            ding: new Audio('assets/sounds/elevator/elevator-ding.mp3')
        };
        Object.values(elevatorSounds).forEach(sound => {
            sound.preload = 'auto';
            sound.addEventListener('error', function () {});
        });
        function playElevatorSound(name) {
            try {
                const sound = elevatorSounds[name];
                sound.currentTime = 0;
                const playback = sound.play();
                if (playback) playback.catch(function () {});
            } catch (error) { /* Audio is optional. */ }
        }
        function elevatorButtonPressStage() { playElevatorSound('button'); }
        function elevatorArrivalStage() { playElevatorSound('ding'); }
        function elevatorDoorsOpeningStage() {}
        function resetElevatorButtons() {
            elevatorButtons.forEach(button => {
                button.disabled = false;
                button.classList.remove('is-selected');
                button.setAttribute('aria-pressed', 'false');
            });
        }
        const elevatorDelay = ms => new Promise(resolve => setTimeout(resolve, ms));

        elevatorButtons.forEach(button => button.addEventListener('click', async function () {
            if (elevatorBusy) return;
            elevatorBusy = true;
            const run = ++elevatorRun;
            elevatorButtonPressStage();
            button.classList.add('is-selected');
            button.setAttribute('aria-pressed', 'true');
            elevatorButtons.forEach(item => { item.disabled = true; });
            document.getElementById('close-elevator').focus();
            const available = button.dataset.destination === 'hall';
            elevatorStatus.textContent = available ? 'ROOMS' : 'Coming Soon';
            if (!available) {
                await elevatorDelay(1200);
                if (run !== elevatorRun) return;
                resetElevatorButtons();
                elevatorBusy = false;
                elevatorStatus.textContent = 'SELECT DESTINATION';
                button.focus();
                return;
            }
            await elevatorDelay(900);
            if (run !== elevatorRun) return;
            elevatorStatus.textContent = 'ARRIVED';
            await elevatorDelay(350);
            if (run !== elevatorRun) return;
            elevatorDoorsOpeningStage();
            await elevatorDelay(350);
            if (run !== elevatorRun) return;
            elevatorMenu.classList.add('is-closing');
            await elevatorDelay(450);
            if (run !== elevatorRun) return;
            // Keep the selection lit and input blocked until Hall finishes loading.
            const finishTransition = function () {
                viewer.off('load', finishTransition);
                viewer.off('error', failTransition);
                if (run !== elevatorRun || viewer.getScene() !== 'hall') return;
                elevatorArrivalStage();
                elevatorBusy = false;
                resetElevatorButtons();
                closeElevatorMenu();
            };
            const failTransition = function () {
                viewer.off('load', finishTransition);
                viewer.off('error', failTransition);
                elevatorMenu.classList.remove('is-closing');
                elevatorBusy = false;
                resetElevatorButtons();
                elevatorStatus.textContent = 'Unable to load Rooms. Please try again.';
            };
            viewer.on('load', finishTransition);
            viewer.on('error', failTransition);
            try {
                viewer.loadScene('hall');
            } catch (error) {
                failTransition();
            }
        }));

        function openElevatorMenu() {
            playElevatorSound('door');
            previousFocus = document.activeElement;
            elevatorMenu.classList.remove('is-closing');
            elevatorStatus.textContent = 'SELECT DESTINATION';
            resetElevatorButtons();
            elevatorBusy = false;
            elevatorMenu.hidden = false;
            elevatorMenu.querySelector('button').focus();
        }

        function closeElevatorMenu() {
            if (elevatorBusy) return;
            ++elevatorRun;
            elevatorBusy = false;
            elevatorMenu.hidden = true;
            if (previousFocus) previousFocus.focus();
        }

        document.getElementById('close-elevator').addEventListener('click', closeElevatorMenu);
        elevatorMenu.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                event.preventDefault();
                closeElevatorMenu();
            }
            if (event.key === 'Tab') {
                const buttons = elevatorMenu.querySelectorAll('button:not(:disabled)');
                const first = buttons[0];
                const last = buttons[buttons.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                    event.preventDefault();
                    first.focus();
                }
            }
            event.stopPropagation();
        });

        // Keep overlay gestures from reaching the panorama, including in fullscreen.
        ['pointerdown', 'pointermove', 'pointerup', 'mousedown', 'mousemove', 'mouseup', 'touchstart', 'touchmove', 'touchend', 'click', 'dblclick', 'wheel'].forEach(type => {
            elevatorMenu.addEventListener(type, event => event.stopPropagation());
        });

        function createEnterHotelButton(hotSpotDiv, text) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'enter-hotel-button';
            button.setAttribute('aria-label', text);
            const label = document.createElement('span');
            label.textContent = text.toUpperCase();
            const arrow = document.createElement('span');
            arrow.className = 'enter-hotel-arrow';
            arrow.textContent = '›';
            arrow.setAttribute('aria-hidden', 'true');
            button.append(label, arrow);
            hotSpotDiv.appendChild(button);
            // Clicks bubble to Pannellum's existing scene navigation handler.
        }

        // Exterior schedule uses the visitor's local device time.
        const exteriorSchedule = {
            dayStartHour: 7,
            nightStartHour: 19,
            dayPanorama: 'Panoramas/hotel_exterior_day.png',
            nightPanorama: 'Panoramas/hotel_exterior_night.png'
        };
        function getExteriorPanorama(date = new Date()) {
            const hour = date.getHours();
            return hour >= exteriorSchedule.dayStartHour && hour < exteriorSchedule.nightStartHour
                ? exteriorSchedule.dayPanorama : exteriorSchedule.nightPanorama;
        }

        // Room lighting assets. Hall entry always starts with lights on.
        // A future lighting switch should preserve viewer yaw, pitch, and hfov.
        const room101Lighting = {
            on: 'Panoramas/room101-lights-on.png',
            off: 'Panoramas/room101-lights-off.png'
        };

        function createRoomLightSwitch() {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'room-light-switch';
            button.hidden = true;
            const rocker = document.createElement('span');
            rocker.className = 'room-light-rocker';
            rocker.setAttribute('aria-hidden', 'true');
            const label = document.createElement('span');
            label.className = 'room-light-label';
            button.append(rocker, label);
            return button;
        }

        function toggleRoomLights(event, destination) {
            viewer.loadScene(destination, viewer.getPitch(), viewer.getYaw(), viewer.getHfov());
        }

        // All navigation is configured here. Camera and hotspot positions are temporary.
        const viewer = pannellum.viewer('viewer', {
            default: {
                firstScene: 'hotel_exterior',
                autoLoad: true
            },
            scenes: {
                hotel_exterior: {
                    type: 'equirectangular',
                    panorama: getExteriorPanorama(),
                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: 0,
                            type: 'scene',
                            text: 'Enter Hotel',
                            cssClass: 'enter-hotel-hotspot',
                            createTooltipFunc: createEnterHotelButton,
                            createTooltipArgs: 'Enter Hotel',
                            sceneId: 'lobby'
                        }
                    ]
                },
                lobby: {
                    type: 'equirectangular',
                    panorama: 'Panoramas/lobby.png',
                    pitch: 0,
                    yaw: 0,
                    hfov: 100,
                    hotSpots: [
                        { pitch: -4.48, yaw: -0.96, type: 'scene', text: 'Desk', sceneId: 'desk', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Desk' },
                        { pitch: 0.53, yaw: 72.77, type: 'scene', text: 'Hall', sceneId: 'hall', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Hall' },
                        { pitch: 10.59, yaw: 130.47, type: 'info', text: 'Elevator', clickHandlerFunc: openElevatorMenu, cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Elevator' }
                    ]
                },
                desk: {
                    type: 'equirectangular',
                    panorama: 'Panoramas/lobby.png',
                    pitch: -5,
                    yaw: -45,
                    hfov: 65,
                    // Temporary reception viewing limits; tune using the debug readout.
                    minYaw: -100,
                    maxYaw: 100,
                    minPitch: -30,
                    maxPitch: 30,
                    hotSpots: [
                        {
                            pitch: -2.21,
                            yaw: -1.47,
                            type: 'info',
                            text: 'Check In / Login',
                            cssClass: 'enter-hotel-hotspot',
                            createTooltipFunc: createEnterHotelButton,
                            createTooltipArgs: 'Check In / Login',
                            clickHandlerFunc: function () {
                                alert('Check-in system coming later.');
                            }
                        },
                        { pitch: 4.13, yaw: 72.90, type: 'scene', text: 'Hall', sceneId: 'hall', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Hall' },
                        { pitch: 0, yaw: -80, type: 'scene', text: 'Back to Lobby', sceneId: 'lobby', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Back to Lobby' }
                    ]
                },
                hall: {
                    type: 'equirectangular',
                    panorama: 'Panoramas/hall.png',
                    hotSpots: [
                        { pitch: 0, yaw: 180, type: 'scene', text: 'Back to Lobby', sceneId: 'lobby', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Back to Lobby' },
                        { pitch: 0, yaw: 45, type: 'scene', text: 'Room 101', sceneId: 'room101', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Room 101' }
                    ]
                },
                room101: {
                    type: 'equirectangular',
                    panorama: room101Lighting.on,
                    hotSpots: [
                        { pitch: 0, yaw: 180, type: 'scene', text: 'Back to Hall', sceneId: 'hall', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Back to Hall' }
                    ]
                },
                room101_lights_off: {
                    type: 'equirectangular',
                    panorama: room101Lighting.off,
                    hotSpots: [
                        { pitch: 0, yaw: 180, type: 'scene', text: 'Back to Hall', sceneId: 'hall', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Back to Hall' }
                    ]
                }
            }
        });

        // Fixed room UI lives inside the viewer so it also works in fullscreen.
        const roomLightSwitch = createRoomLightSwitch();
        document.getElementById('viewer').appendChild(roomLightSwitch);
        function updateRoomLightSwitch(sceneId) {
            const isOn = sceneId === 'room101';
            roomLightSwitch.hidden = !isOn && sceneId !== 'room101_lights_off';
            roomLightSwitch.classList.toggle('is-on', isOn);
            roomLightSwitch.classList.toggle('is-off', !isOn);
            roomLightSwitch.querySelector('.room-light-label').textContent = isOn ? 'Lights ON' : 'Lights OFF';
            roomLightSwitch.setAttribute('aria-label', isOn ? 'Lights ON: turn lights off' : 'Lights OFF: turn lights on');
        }
        roomLightSwitch.addEventListener('click', function (event) {
            event.stopPropagation();
            const sceneId = viewer.getScene();
            if (!viewer.isLoaded() || (sceneId !== 'room101' && sceneId !== 'room101_lights_off')) return;
            toggleRoomLights(event, sceneId === 'room101' ? 'room101_lights_off' : 'room101');
        });
        ['pointerdown', 'pointermove', 'pointerup', 'mousedown', 'mousemove', 'mouseup', 'touchstart', 'touchmove', 'touchend', 'dblclick', 'wheel'].forEach(type => {
            roomLightSwitch.addEventListener(type, event => event.stopPropagation());
        });
        viewer.on('scenechange', updateRoomLightSwitch);
        updateRoomLightSwitch(viewer.getScene());

        // Pannellum emits scenechange before loading the new panorama.
        // Update only the active exterior image, keeping its hotspot configuration.
        viewer.on('scenechange', function (sceneId) {
            if (sceneId === 'hotel_exterior') {
                viewer.getConfig().panorama = getExteriorPanorama();
            }
            if (sceneId === 'room101') {
                viewer.getConfig().panorama = room101Lighting.on;
            }
        });

        // Temporary camera debug readout. Remove this block and #camera-debug CSS.
        document.getElementById('viewer').appendChild(elevatorMenu);
        // Keeping it inside the viewer also makes it visible in fullscreen mode.
        const cameraDebug = document.createElement('div');
        cameraDebug.id = 'camera-debug';
        document.getElementById('viewer').appendChild(cameraDebug);

        // Temporary hotspot-placement tool; remove this block with the readout.
        const panoramaElement = document.getElementById('viewer');
        let mousePosition = null;
        let placementMessage = '';
        let placementExpires = 0;

        function trackMousePosition(event) {
            const coordinates = viewer.mouseEventToCoords(event);
            mousePosition = { pitch: coordinates[0], yaw: coordinates[1] };
        }

        panoramaElement.addEventListener('mousemove', trackMousePosition);
        panoramaElement.addEventListener('mouseleave', function () {
            mousePosition = null;
        });

        panoramaElement.addEventListener('click', function (event) {
            if (!event.shiftKey) return;
            // Capture before hotspot handlers so Shift-click never navigates.
            event.preventDefault();
            event.stopImmediatePropagation();
            trackMousePosition(event);
            placementMessage = 'Hotspot position:\n' +
                'yaw: ' + mousePosition.yaw.toFixed(2) + '\n' +
                'pitch: ' + mousePosition.pitch.toFixed(2);
            placementExpires = performance.now() + 3000;
            console.log(placementMessage);
        }, true);

        function updateCameraDebug() {
            const yaw = viewer.getYaw();
            const normalizedView = ((yaw % 360) + 360) % 360;
            // Wrap again after rounding so the display never reads 360.00°.
            const view = (Math.round(normalizedView * 100) % 36000) / 100;
            cameraDebug.textContent = 'Yaw: ' + yaw.toFixed(2) + '°\n' +
                'Pitch: ' + viewer.getPitch().toFixed(2) + '°\n' +
                'View: ' + view.toFixed(2) + '°\n' +
                'Mouse Yaw: ' + (mousePosition ? mousePosition.yaw.toFixed(2) : '--') + '°\n' +
                'Mouse Pitch: ' + (mousePosition ? mousePosition.pitch.toFixed(2) : '--') + '°' +
                (performance.now() < placementExpires ? '\n\n' + placementMessage : '');
            requestAnimationFrame(updateCameraDebug);
        }
        updateCameraDebug();
    </script>
</body>
</html>

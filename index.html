<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobVision Hotel</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
</head>

<body style="margin: 0;">

    <div id="viewer" style="width: 100vw; height: 100vh;"></div>

    <!-- Temporary camera debug readout. -->
    <div id="camera-debug" style="position: fixed; bottom: 12px; left: 12px; z-index: 1000; padding: 8px 10px; border-radius: 4px; background: rgba(0, 0, 0, 0.75); color: #fff; font: 13px/1.5 monospace; pointer-events: none;">
        Pitch: --°<br>Yaw: --°
    </div>

    <button id="reset-check-in" type="button" style="position: fixed; bottom: 12px; right: 12px; z-index: 1000; padding: 8px 10px; cursor: pointer;">Reset Check-In</button>

    <div id="check-in-overlay" role="dialog" aria-modal="true" aria-labelledby="check-in-title" hidden style="position: fixed; inset: 0; z-index: 2000; background: rgba(0, 0, 0, 0.55);">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(320px, calc(100vw - 64px)); padding: 24px; border-radius: 8px; background: white; color: #222; font-family: Arial, sans-serif;">
            <h2 id="check-in-title" style="margin-top: 0;">HOTEL CHECK-IN</h2>
            <p>
                <label for="check-in-room">Room number:</label><br>
                <input id="check-in-room" type="text" inputmode="numeric" autocomplete="off" style="margin-top: 6px; padding: 6px; width: 100%; box-sizing: border-box;">
            </p>
            <p id="check-in-message" role="status" aria-live="polite"></p>
            <button id="confirm-check-in" type="button">CHECK IN</button>
            <button id="close-check-in" type="button">Close</button>
        </div>
    </div>

    <script>
        const checkInOverlay = document.getElementById('check-in-overlay');
        const checkInMessage = document.getElementById('check-in-message');
        const confirmCheckIn = document.getElementById('confirm-check-in');
        const checkInRoom = document.getElementById('check-in-room');
        // Add future available rooms here, keyed by their room number.
        // Future customization data can use a separate key per room, such as
        // 'mobvision:room:101:customization'; check-in reset only clears access data.
        const availableRooms = {
            '101': { sceneId: 'room101' }
        };
        let previousFocus;

        function openCheckIn() {
            previousFocus = document.activeElement;
            checkInMessage.textContent = '';
            checkInRoom.value = '';
            checkInOverlay.hidden = false;
            checkInRoom.focus();
        }

        function closeCheckIn() {
            checkInOverlay.hidden = true;
            if (previousFocus) previousFocus.focus();
        }

        confirmCheckIn.addEventListener('click', function () {
            const roomNumber = checkInRoom.value.trim();
            if (!Object.prototype.hasOwnProperty.call(availableRooms, roomNumber)) {
                checkInMessage.textContent = 'That room is not available.';
                return;
            }
            try {
                localStorage.setItem('assignedRoom', roomNumber);
                localStorage.setItem('checkedIn', 'true');
                checkInMessage.textContent = 'Check-in complete. You are checked into Room ' + roomNumber + '.';
            } catch (error) {
                checkInMessage.textContent = 'Unable to save check-in. Please enable local storage and try again.';
            }
        });

        document.getElementById('close-check-in').addEventListener('click', closeCheckIn);
        document.addEventListener('keydown', function (event) {
            if (!checkInOverlay.hidden && event.key === 'Escape') closeCheckIn();
        });

        document.getElementById('reset-check-in').addEventListener('click', function () {
            try {
                localStorage.removeItem('checkedIn');
                localStorage.removeItem('assignedRoom');
                checkInMessage.textContent = '';
            } catch (error) {
                alert('Unable to reset check-in. Please enable local storage and try again.');
            }
        });

        function enterRoom101() {
            let hasRoom = false;
            try {
                hasRoom = localStorage.getItem('checkedIn') === 'true' &&
                    localStorage.getItem('assignedRoom') === '101';
            } catch (error) {
                hasRoom = false;
            }
            if (hasRoom) {
                viewer.loadScene(availableRooms['101'].sceneId);
            } else {
                alert('You are not checked into this room. Please check in at reception.');
            }
        }

        const viewer = pannellum.viewer('viewer', {
            default: {
                firstScene: 'lobby_entry',
                autoLoad: true
            },

            scenes: {
                lobby_entry: {
                    type: 'equirectangular',
                    panorama: 'Panoramas/entry.jpg',

                    hotSpots: [
                        {
                            pitch: -1.98,
                            yaw: 133.48,
                            type: 'scene',
                            text: 'Go to Lobby Center',
                            sceneId: 'lobby_center'
                        }
                    ]
                },

                lobby_center: {
                    type: 'equirectangular',
                    panorama: 'Panoramas/lobby_center.jpg',

                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: 0,
                            type: 'scene',
                            text: 'Go to Lobby Desk',
                            sceneId: 'lobby_desk'
                        },
                        {
                            pitch: 0,
                            yaw: 90,
                            type: 'scene',
                            text: 'Go to Lobby Hall Door',
                            sceneId: 'lobby_hall_door'
                        },
                        {
                            pitch: 0,
                            yaw: 180,
                            type: 'scene',
                            text: 'Back to Lobby Entry',
                            sceneId: 'lobby_entry'
                        }
                    ]
                },

                lobby_desk: {
                    type: 'equirectangular',
                    panorama: 'Panoramas/desk.jpg',

                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: 0,
                            type: 'info',
                            text: 'Check In',
                            clickHandlerFunc: openCheckIn
                        },
                        {
                            pitch: 0,
                            yaw: 180,
                            type: 'scene',
                            text: 'Back to Lobby Center',
                            sceneId: 'lobby_center'
                        }
                    ]
                },

                lobby_hall_door: {
                    type: 'equirectangular',
                    panorama: 'Panoramas/lobby_hall_door.jpg',

                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: 180,
                            type: 'scene',
                            text: 'Back to Lobby Center',
                            sceneId: 'lobby_center'
                        },
                        {
                            pitch: 0,
                            yaw: 0,
                            type: 'scene',
                            text: 'Go to Hall',
                            sceneId: 'hall'
                        }
                    ]
                },

                hall: {
                    type: 'equirectangular',
                    panorama: 'Panoramas/hall.jpg',

                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: 180,
                            type: 'scene',
                            text: 'Back to Lobby Hall Door',
                            sceneId: 'lobby_hall_door'
                        },
                        {
                            pitch: 0,
                            yaw: 0,
                            type: 'info',
                            text: 'Room 101',
                            clickHandlerFunc: enterRoom101
                        }
                    ]
                },

                room101: {
                    type: 'equirectangular',
                    panorama: 'Panoramas/room101.jpg',

                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: 180,
                            type: 'scene',
                            text: 'Back to Hall',
                            sceneId: 'hall'
                        }
                    ]
                }
            }
        });

        // Temporary debug display; remove this block and #camera-debug when done.
        const cameraDebug = document.getElementById('camera-debug');
        function updateCameraDebug() {
            cameraDebug.innerText = 'Pitch: ' + viewer.getPitch().toFixed(2) + '°\n' +
                'Yaw: ' + viewer.getYaw().toFixed(2) + '°';
            requestAnimationFrame(updateCameraDebug);
        }
        updateCameraDebug();
    </script>

</body>
</html>

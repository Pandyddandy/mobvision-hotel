<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobVision Hotel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        #viewer { width: 100%; height: 100%; }
        /* Custom exterior hotspot. Pannellum positions the outer element. */
        .enter-hotel-hotspot {
            width: 0;
            height: 0;
            margin: 0;
            background: none;
            border: 0;
        }
        .enter-hotel-button {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            width: 190px;
            height: 52px;
            box-sizing: border-box;
            padding: 0 22px;
            border: 1px solid rgba(211, 177, 112, 0.85);
            border-radius: 999px;
            background: rgba(20, 19, 17, 0.78);
            color: #ead3a3;
            box-shadow: 0 0 16px rgba(211, 177, 112, 0.24);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font: 500 13px/1 Georgia, serif;
            letter-spacing: 1.8px;
            white-space: nowrap;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }
        .enter-hotel-arrow { font-size: 24px; line-height: 1; }
        @media (hover: hover) and (pointer: fine) {
            .enter-hotel-button:hover {
                transform: translate(-50%, calc(-50% - 3px));
                background: rgba(30, 27, 21, 0.9);
                box-shadow: 0 0 24px rgba(211, 177, 112, 0.45);
            }
        }
        .enter-hotel-button:active {
            transform: translate(-50%, calc(-50% + 1px)) scale(0.97);
            background: rgba(65, 51, 29, 0.95);
            box-shadow: 0 0 10px rgba(211, 177, 112, 0.5);
        }
        .enter-hotel-button:focus-visible {
            outline: 2px solid #ead3a3;
            outline-offset: 4px;
        }
        @media (max-width: 600px) {
            .enter-hotel-button {
                width: 180px;
                height: 54px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .enter-hotel-button { transition: none; }
        }
        /* Temporary camera debug readout; remove with its HTML and update block. */
        #camera-debug {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 1000;
            padding: 8px 10px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font: 13px/1.5 monospace;
            white-space: pre;
            pointer-events: none;
        }
        #elevator-menu {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.55);
            align-items: center;
            justify-content: center;
        }
        #elevator-menu:not([hidden]) { display: flex; }
        .menu-panel {
            width: min(280px, calc(100vw - 64px));
            padding: 24px;
            border-radius: 8px;
            background: white;
            color: #222;
            font-family: Arial, sans-serif;
        }
        .menu-panel h2 { margin-top: 0; }
        .menu-panel button {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div id="elevator-menu" role="dialog" aria-modal="true" aria-labelledby="elevator-title" hidden>
        <div class="menu-panel">
            <h2 id="elevator-title">Elevator</h2>
            <button type="button">Rooms</button>
            <button type="button">Café</button>
            <button type="button">Pool</button>
            <button type="button">Gym</button>
            <button id="close-elevator" type="button">Close</button>
        </div>
    </div>
    <script>
        const elevatorMenu = document.getElementById('elevator-menu');
        let previousFocus;

        function openElevatorMenu() {
            previousFocus = document.activeElement;
            elevatorMenu.hidden = false;
            elevatorMenu.querySelector('button').focus();
        }

        function closeElevatorMenu() {
            elevatorMenu.hidden = true;
            if (previousFocus) previousFocus.focus();
        }

        document.getElementById('close-elevator').addEventListener('click', closeElevatorMenu);
        elevatorMenu.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                event.preventDefault();
                closeElevatorMenu();
            }
            if (event.key === 'Tab') {
                const buttons = elevatorMenu.querySelectorAll('button');
                const first = buttons[0];
                const last = buttons[buttons.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                    event.preventDefault();
                    first.focus();
                }
            }
            event.stopPropagation();
        });

        function createEnterHotelButton(hotSpotDiv, text) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'enter-hotel-button';
            button.setAttribute('aria-label', text);
            const label = document.createElement('span');
            label.textContent = text.toUpperCase();
            const arrow = document.createElement('span');
            arrow.className = 'enter-hotel-arrow';
            arrow.textContent = '›';
            arrow.setAttribute('aria-hidden', 'true');
            button.append(label, arrow);
            hotSpotDiv.appendChild(button);
            // Clicks bubble to Pannellum's existing scene navigation handler.
        }

        // All navigation is configured here. Camera and hotspot positions are temporary.
        const viewer = pannellum.viewer('viewer', {
            default: {
                firstScene: 'hotel_exterior',
                autoLoad: true
            },
            scenes: {
                hotel_exterior: {
                    type: 'equirectangular',
                    panorama: 'panoramas/hotel_exterior.png',
                    hotSpots: [
                        {
                            pitch: 0,
                            yaw: 0,
                            type: 'scene',
                            text: 'Enter Hotel',
                            cssClass: 'enter-hotel-hotspot',
                            createTooltipFunc: createEnterHotelButton,
                            createTooltipArgs: 'Enter Hotel',
                            sceneId: 'lobby'
                        }
                    ]
                },
                lobby: {
                    type: 'equirectangular',
                    panorama: 'panoramas/lobby.png',
                    pitch: 0,
                    yaw: 0,
                    hfov: 100,
                    hotSpots: [
                        { pitch: -4.48, yaw: -0.96, type: 'scene', text: 'Desk', sceneId: 'desk', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Desk' },
                        { pitch: 0.53, yaw: 72.77, type: 'scene', text: 'Hall', sceneId: 'hall', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Hall' },
                        { pitch: 10.59, yaw: 130.47, type: 'info', text: 'Elevator', clickHandlerFunc: openElevatorMenu, cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Elevator' }
                    ]
                },
                desk: {
                    type: 'equirectangular',
                    panorama: 'panoramas/lobby.png',
                    pitch: -5,
                    yaw: -45,
                    hfov: 65,
                    // Temporary reception viewing limits; tune using the debug readout.
                    minYaw: -100,
                    maxYaw: 100,
                    minPitch: -30,
                    maxPitch: 30,
                    hotSpots: [
                        {
                            pitch: -5,
                            yaw: -45,
                            type: 'info',
                            text: 'Check In / Login',
                            cssClass: 'enter-hotel-hotspot',
                            createTooltipFunc: createEnterHotelButton,
                            createTooltipArgs: 'Check In / Login',
                            clickHandlerFunc: function () {
                                alert('Check-in system coming later.');
                            }
                        },
                        { pitch: 0, yaw: 45, type: 'scene', text: 'Hall', sceneId: 'hall', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Hall' },
                        { pitch: 0, yaw: -80, type: 'scene', text: 'Back to Lobby', sceneId: 'lobby', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Back to Lobby' }
                    ]
                },
                hall: {
                    type: 'equirectangular',
                    panorama: 'panoramas/hall.png',
                    hotSpots: [
                        { pitch: 0, yaw: 180, type: 'scene', text: 'Back to Lobby', sceneId: 'lobby', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Back to Lobby' },
                        { pitch: 0, yaw: 45, type: 'scene', text: 'Room 101', sceneId: 'room101', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Room 101' }
                    ]
                },
                room101: {
                    type: 'equirectangular',
                    panorama: 'panoramas/room101.png',
                    hotSpots: [
                        { pitch: 0, yaw: 180, type: 'scene', text: 'Back to Hall', sceneId: 'hall', cssClass: 'enter-hotel-hotspot', createTooltipFunc: createEnterHotelButton, createTooltipArgs: 'Back to Hall' }
                    ]
                }
            }
        });

        // Temporary camera debug readout. Remove this block and #camera-debug CSS.
        // Keeping it inside the viewer also makes it visible in fullscreen mode.
        const cameraDebug = document.createElement('div');
        cameraDebug.id = 'camera-debug';
        document.getElementById('viewer').appendChild(cameraDebug);

        // Temporary hotspot-placement tool; remove this block with the readout.
        const panoramaElement = document.getElementById('viewer');
        let mousePosition = null;
        let placementMessage = '';
        let placementExpires = 0;

        function trackMousePosition(event) {
            const coordinates = viewer.mouseEventToCoords(event);
            mousePosition = { pitch: coordinates[0], yaw: coordinates[1] };
        }

        panoramaElement.addEventListener('mousemove', trackMousePosition);
        panoramaElement.addEventListener('mouseleave', function () {
            mousePosition = null;
        });

        panoramaElement.addEventListener('click', function (event) {
            if (!event.shiftKey) return;
            // Capture before hotspot handlers so Shift-click never navigates.
            event.preventDefault();
            event.stopImmediatePropagation();
            trackMousePosition(event);
            placementMessage = 'Hotspot position:\n' +
                'yaw: ' + mousePosition.yaw.toFixed(2) + '\n' +
                'pitch: ' + mousePosition.pitch.toFixed(2);
            placementExpires = performance.now() + 3000;
            console.log(placementMessage);
        }, true);

        function updateCameraDebug() {
            const yaw = viewer.getYaw();
            const normalizedView = ((yaw % 360) + 360) % 360;
            // Wrap again after rounding so the display never reads 360.00°.
            const view = (Math.round(normalizedView * 100) % 36000) / 100;
            cameraDebug.textContent = 'Yaw: ' + yaw.toFixed(2) + '°\n' +
                'Pitch: ' + viewer.getPitch().toFixed(2) + '°\n' +
                'View: ' + view.toFixed(2) + '°\n' +
                'Mouse Yaw: ' + (mousePosition ? mousePosition.yaw.toFixed(2) : '--') + '°\n' +
                'Mouse Pitch: ' + (mousePosition ? mousePosition.pitch.toFixed(2) : '--') + '°' +
                (performance.now() < placementExpires ? '\n\n' + placementMessage : '');
            requestAnimationFrame(updateCameraDebug);
        }
        updateCameraDebug();
    </script>
</body>
</html>
